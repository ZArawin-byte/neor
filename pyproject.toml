[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
# Errors only for the hackathon: undefined names, unused imports, syntax. Style can wait.
select = ["E4", "E7", "E9", "F"]
