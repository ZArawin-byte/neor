# Render blueprint for the neor API: Dashboard -> New -> Blueprint -> pick this repo.
# Production needs Supabase: Render's disk is wiped on every deploy, so demo-mode JSON storage won't last.
services:
  - type: web
    name: neor-api
    runtime: python
    plan: free            # sleeps after ~15 min idle: open /api/health a minute before the demo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.15"
      - key: FRONTEND_ORIGINS
        value: https://neor-closet.web.app,https://neor-closet.firebaseapp.com,http://localhost:5173
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # server only, never sent to the browser
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PERCEPTRON_API_KEY
        sync: false
      - key: DEMO_EMAIL
        sync: false
      # Optional: each feature stays off (or falls back) while its key is blank.
      - key: GOOGLE_VISION_API_KEY   # bargain market photo matching
        sync: false
      - key: SERPAPI_API_KEY         # bargain market product search
        sync: false
      - key: TWILIO_ACCOUNT_SID      # text notifications
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TEXTBELT_KEY
        sync: false
      - key: SMTP_USER               # email notifications
        sync: false
      - key: SMTP_PASSWORD
        sync: false
